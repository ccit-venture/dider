<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><%= it.title ?? "Dider" %></title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
    <%~ include("/partials/homepage-navbar") %>
    <main class="max-w-5xl w-full mx-auto px-4 py-8 flex-1">
      <% if (it.flash) { %>
        <div class="<%= it.flash.type === 'success' ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : 'bg-red-50 border-red-300 text-red-800' %> border px-4 py-3 rounded-lg mb-6">
          <%= it.flash.message %>
        </div>
      <% } %>
      <%~ it.body %>
    </main>
    <footer class="text-center text-xs text-slate-400 py-6">Dider · Venture Studio CCIT-FTUI</footer>
  </body>
</html>
